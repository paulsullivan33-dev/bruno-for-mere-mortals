site_name: Bruno for Mere Mortals
site_description: An API client that keeps your requests as plain text files in a folder you own. Writing requests by hand, checking answers with assertions and tests, keeping secrets out of the files, and running the whole collection from the command line, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/bruno-for-mere-mortals/
